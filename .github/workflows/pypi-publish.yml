name: Publish to PyPI

# Build and publish the sdist + wheel to PyPI on every version tag (v1.2.3),
# using PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
#
# The v* tag is pushed by the GitHub release step in scripts/release.sh, so a
# release fans out to three CI jobs off the same tag: this one (PyPI),
# docker-publish.yml (image), and the Hub description sync.
#
# One-time setup on PyPI (https://pypi.org/manage/project/
#   orionbelt-semantic-layer-mcp/settings/publishing/):
#   add a trusted publisher →
#     owner:        ralforion
#     repository:   orionbelt-semantic-layer-mcp
#     workflow:     pypi-publish.yml
#     environment:  pypi

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Read-only by default; the publish job below raises only id-token, and only
# for itself.
permissions:
  contents: read

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/orionbelt-semantic-layer-mcp/
    permissions:
      contents: read   # a job-level block replaces the set, so restate this
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify every Action is pinned to its named release
        run: ./scripts/check-action-pins.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
